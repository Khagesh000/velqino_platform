services:
  # Main Django Web Service
  - type: web
    name: velqino-backend
    runtime: python
    rootDir: server/velqino_backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT velqino_backend.asgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: velqino_backend.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: velqino-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: velqino-redis
          type: redis
          property: connectionString

  # Celery Worker
  - type: worker
    name: velqino-celery
    runtime: python
    rootDir: server/velqino_backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A velqino_backend worker --loglevel=info"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: velqino_backend.settings
      - key: DATABASE_URL
        fromDatabase:
          name: velqino-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: velqino-redis
          type: redis
          property: connectionString

  # Redis
  - type: redis
    name: velqino-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: velqino-db
    plan: free